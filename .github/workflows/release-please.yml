# release-please — simple, one package (work item 6). Releases need the
# owner's explicit "go release"; the release PR is never merged by CI.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@65948a2cf4862e501bdcf5480006c2110cc92a91 # v1.24.4
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
