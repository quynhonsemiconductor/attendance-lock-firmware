# release-please — simple, one package (work item 6). Releases need the
# owner's explicit "go release"; the release PR is never merged by CI.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
