# release-please — simple, one package (work item 6). Releases need the
# owner's explicit "go release"; the release PR is never merged by CI.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@4ab3aaec8d70a2f0fb9a38e8a5a96cebe90e58e5 # v1.27.0
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
