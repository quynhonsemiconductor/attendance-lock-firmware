# release-please — simple, one package (work item 6). Releases need the
# owner's explicit "go release"; the release PR is never merged by CI.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@de56bff40c5468623aa9e69d1ebe8e638e874bdf # v1.24.2
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
