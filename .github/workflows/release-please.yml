# release-please — simple, one package (work item 6). Releases need the
# owner's explicit "go release"; the release PR is never merged by CI.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
