# =============================================================================
# security — shared gates from `ci`: zizmor/actionlint over the workflows,
# gitleaks + osv-scanner + Semgrep. Thin caller, SHA-pinned (ci's v1 tag
# moves on every merge). No container scan: the firmware image build has no
# container artifact; the toolchain pin is the digest in ci.yml.
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
  # No `schedule:` here. The repo's ONE periodic scan is scheduled-security.yml
  # (daily, osv blocking); a weekly run of the same reusable was a duplicate that
  # cost runner time and gave a red advisory two places to be read.

concurrency:
  group: security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('main-{0}', github.sha) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
    with:
      blocking: true
      combine: true # actionlint + zizmor as ONE job: `actions-security / Workflow security (actionlint, zizmor)`

  security:
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: quynhonsemiconductor/ci/.github/workflows/security.yml@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
    with:
      product: attendance-lock
      combine: true # one job: `security / Security scans (Gitleaks, osv-scanner, Semgrep)`
      scan_container: false
      osv_blocking: true
